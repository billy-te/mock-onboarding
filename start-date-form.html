<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Submit Hire Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #f7f8fa;
      color: #1c2430;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .top {
      background: #fff;
      padding: 18px 28px 16px;
      border-bottom: 1px solid #e6e8ee;
    }
    .crumb {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      font-size: 13px;
      color: #9aa1ad;
    }
    .crumb a { color: #8b919e; text-decoration: none; }
    h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #243041;
    }
    main { padding: 48px 20px 64px; }
    form {
      width: min(680px, 100%);
      min-height: 280px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #eceef2;
      border-radius: 6px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
      padding: 36px 48px 28px;
      display: flex;
      flex-direction: column;
    }
    .prompt {
      margin: 4px 0 28px;
      text-align: center;
      font-size: 16px;
      font-weight: 500;
      color: #3c4454;
    }
    label {
      display: block;
      margin: 0 0 6px;
      font-size: 12px;
      color: #8b919e;
    }
    .req { color: #e11d48; }
    input {
      width: min(280px, 100%);
      height: 36px;
      padding: 0 12px;
      border: 1px solid #d5d9e2;
      border-radius: 6px;
      background: #fff;
      font: inherit;
      font-size: 14px;
      color: #1c2430;
    }
    input::placeholder { color: #b0b6c0; }
    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 56px;
    }
    button {
      height: 36px;
      padding: 0 22px;
      border: 0;
      border-radius: 999px;
      background: #1a6e5c;
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .done {
      display: none;
      margin: 12px 0 0;
      text-align: right;
      font-size: 14px;
      color: #14915f;
    }
  </style>
</head>
<body>
  <header class="top">
    <p class="crumb">
      <a href="onboarding.html">Onboarding</a>
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M4.5 2.5 8 6 4.5 9.5" stroke="#c5c9d1" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <a href="update-candidate-start-date.html">Update Candidate Start Date</a>
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M4.5 2.5 8 6 4.5 9.5" stroke="#c5c9d1" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Assign Form
    </p>
    <h1 id="page-title">Submit Hire Form for Olive Stone</h1>
  </header>
  <main>
    <form id="start-form">
      <p class="prompt">Please enter below details</p>
      <label for="joining">Date of Joining<span class="req">*</span></label>
      <input id="joining" name="joining" type="text" placeholder="yyyy-MM-dd" required />
      <div class="actions">
        <button type="submit">Submit</button>
      </div>
      <p class="done" id="done">Form submitted.</p>
    </form>
  </main>
  <script>
    var params = new URLSearchParams(location.search);
    var name = params.get("name") || "Olive Stone";
    document.getElementById("page-title").textContent = "Submit Hire Form for " + name;
    document.title = "Submit Hire Form for " + name;
    document.getElementById("start-form").addEventListener("submit", function (event) {
      event.preventDefault();
      document.getElementById("done").style.display = "block";
    });
  </script>
</body>
</html>
